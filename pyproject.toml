[project]
name = "image-phase-registration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "image-registration>=0.2.9",
    "jupyterlab>=4.4.1",
    "matplotlib>=3.10.1",
    "numpy>=2.2.5",
    "scikit-image>=0.25.2",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# from https://docs.astral.sh/ruff/linter/#rule-selection
extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
docstring-code-format = true
